# Reasoning Quality Evaluation
# Tests that the LLM produces logically consistent analysis, appropriate confidence calibration,
# and doesn't make common reasoning errors.

tests:
  # --- Confidence Calibration ---

  - description: "All sources agree bullish - should be high confidence"
    vars:
      ticker: COST
      price_source_id: "yfinance:COST:1706140800"
      price_data: '{"price": 702.00, "change_pct": 1.5, "volume": 2500000, "market_cap": 312000000000, "pe_ratio": 48.0, "52w_high": 710.00, "52w_low": 485.00}'
      fundamentals_source_id: "yfinance:COST:1706140800"
      fundamentals: '{"revenue_growth": 9.0, "gross_margin": 12.5, "operating_margin": 3.5, "eps": 14.60, "membership_renewal_rate": 92.7}'
      indicators_source_id: "yfinance:COST:1706140800"
      indicators: '{"rsi_14": 65.0, "sma_50": 680.0, "sma_200": 620.0, "macd_histogram": 5.0}'
      news_source_id: "newsapi:COST:1706140800"
      article_count: "2"
      news_text: "1. Costco reports record membership signups, renewal rate at 92.7%. 2. Same-store sales growth accelerates to 5.6%."
      sec_source_id: "sec_edgar:COST:1706140800"
      sec_notes: "10-K: 31 new warehouse openings planned. E-commerce revenue up 18%. Net income grew 13%."
    assert:
      - type: is-json
      - type: javascript
        value: "JSON.parse(output).confidence === 'high' || JSON.parse(output).confidence === 'medium'"
      - type: javascript
        value: "JSON.parse(output).signal === 'buy' || JSON.parse(output).signal === 'hold'"

  - description: "Completely conflicting data - must not be high confidence"
    vars:
      ticker: NKE
      price_source_id: "yfinance:NKE:1706140800"
      price_data: '{"price": 97.50, "change_pct": -12.0, "volume": 30000000, "pe_ratio": 28.0, "52w_high": 131.31, "52w_low": 88.66}'
      fundamentals_source_id: "yfinance:NKE:1706140800"
      fundamentals: '{"revenue_growth": -2.0, "gross_margin": 44.5, "operating_margin": 12.0, "eps": 3.73}'
      indicators_source_id: "yfinance:NKE:1706140800"
      indicators: '{"rsi_14": 20.0, "sma_50": 108.0, "sma_200": 105.0, "macd_histogram": -5.0}'
      news_source_id: "newsapi:NKE:1706140800"
      article_count: "3"
      news_text: "1. Nike shares plunge after cutting full-year guidance. 2. Nike Direct sales outperform wholesale channel. 3. Inventory levels return to normal after 18 months of destocking."
      sec_source_id: "sec_edgar:NKE:1706140800"
      sec_notes: "10-K: Greater China revenue recovered 12%. Innovation pipeline includes 40+ new product lines."
    assert:
      - type: is-json
      - type: javascript
        value: "JSON.parse(output).confidence !== 'high'"
      - type: javascript
        value: "JSON.parse(output).bull_case.length >= 2 && JSON.parse(output).bear_case.length >= 2"

  # --- Logical Consistency ---

  - description: "Sell signal must have bear case stronger than bull case"
    vars:
      ticker: WBA
      price_source_id: "yfinance:WBA:1706140800"
      price_data: '{"price": 12.80, "change_pct": -5.5, "volume": 15000000, "pe_ratio": -8.0, "52w_high": 27.02, "52w_low": 11.19}'
      fundamentals_source_id: "yfinance:WBA:1706140800"
      fundamentals: '{"revenue_growth": -4.0, "gross_margin": 18.0, "operating_margin": -3.0, "eps": -1.45, "debt_to_equity": 3.2}'
      indicators_source_id: "yfinance:WBA:1706140800"
      indicators: '{"rsi_14": 25.0, "sma_50": 15.0, "sma_200": 19.0, "macd_histogram": -1.5}'
      news_source_id: "newsapi:WBA:1706140800"
      article_count: "2"
      news_text: "1. Walgreens announces closure of 1200 stores over 3 years. 2. Opioid settlement payments begin, totaling $5.7B."
      sec_source_id: "sec_edgar:WBA:1706140800"
      sec_notes: "10-K: Net loss of $3.2B. Goodwill impairment $5.5B. Dividend cut by 48%."
    assert:
      - type: is-json
      - type: javascript
        value: |
          const r = JSON.parse(output);
          // If signal is sell, bear_case should have more or equal arguments
          if (r.signal === 'sell') {
            return r.bear_case.length >= r.bull_case.length;
          }
          return true;
      - type: javascript
        value: "JSON.parse(output).sentiment_score < 0"

  - description: "Sentiment score aligns with signal direction"
    vars:
      ticker: LLY
      price_source_id: "yfinance:LLY:1706140800"
      price_data: '{"price": 750.00, "change_pct": 3.2, "volume": 4000000, "market_cap": 715000000000, "pe_ratio": 118.0, "52w_high": 780.00, "52w_low": 310.00}'
      fundamentals_source_id: "yfinance:LLY:1706140800"
      fundamentals: '{"revenue_growth": 28.0, "gross_margin": 80.0, "operating_margin": 30.0, "eps": 6.32}'
      indicators_source_id: "yfinance:LLY:1706140800"
      indicators: '{"rsi_14": 70.0, "sma_50": 700.0, "sma_200": 580.0, "macd_histogram": 15.0}'
      news_source_id: "newsapi:LLY:1706140800"
      article_count: "2"
      news_text: "1. Eli Lilly obesity drug Mounjaro prescription volume up 200%. 2. FDA approves Alzheimer drug donanemab."
      sec_source_id: "sec_edgar:LLY:1706140800"
      sec_notes: "10-K: Mounjaro revenue $5.1B first year. R&D pipeline of 28 drugs in Phase 2+."
    assert:
      - type: is-json
      - type: javascript
        value: |
          const r = JSON.parse(output);
          // Buy signal should have positive sentiment, sell should have negative
          if (r.signal === 'buy') return r.sentiment_score > 0;
          if (r.signal === 'sell') return r.sentiment_score < 0;
          return true;

  # --- Risk Flag Quality ---

  - description: "High debt-to-equity flagged as risk"
    vars:
      ticker: T
      price_source_id: "yfinance:T:1706140800"
      price_data: '{"price": 17.20, "change_pct": 0.5, "volume": 30000000, "market_cap": 123000000000, "dividend_yield": 6.5}'
      fundamentals_source_id: "yfinance:T:1706140800"
      fundamentals: '{"revenue_growth": -1.0, "gross_margin": 55.0, "operating_margin": 18.0, "eps": 2.48, "debt_to_equity": 1.8, "total_debt": 137000000000}'
      indicators_source_id: "yfinance:T:1706140800"
      indicators: '{"rsi_14": 48.0, "sma_50": 17.0, "sma_200": 16.5, "macd_histogram": 0.2}'
      news_source_id: "newsapi:T:1706140800"
      article_count: "1"
      news_text: "1. AT&T fiber subscriber growth slows to 200K quarterly additions."
      sec_source_id: "sec_edgar:T:1706140800"
      sec_notes: "10-K: Long-term debt $137B. Interest expense $6.5B annually. Capex $22B for 5G."
    assert:
      - type: is-json
      - type: javascript
        value: |
          const r = JSON.parse(output);
          const hasDebtRisk = r.risk_flags.some(f => f.toLowerCase().includes('debt'));
          const hasBearDebt = r.bear_case.some(b => b.toLowerCase().includes('debt'));
          return hasDebtRisk || hasBearDebt;

  - description: "Customer concentration risk identified"
    vars:
      ticker: PLTR
      price_source_id: "yfinance:PLTR:1706140800"
      price_data: '{"price": 25.00, "change_pct": 2.0, "volume": 45000000, "market_cap": 55000000000, "pe_ratio": 250.0}'
      fundamentals_source_id: "yfinance:PLTR:1706140800"
      fundamentals: '{"revenue_growth": 20.0, "gross_margin": 81.0, "operating_margin": 8.0, "eps": 0.10}'
      indicators_source_id: "yfinance:PLTR:1706140800"
      indicators: '{"rsi_14": 68.0, "sma_50": 22.0, "sma_200": 18.0, "macd_histogram": 1.2}'
      news_source_id: "newsapi:PLTR:1706140800"
      article_count: "2"
      news_text: "1. Palantir wins $480M Army contract renewal. 2. Commercial revenue grows 32% but remains 45% of total."
      sec_source_id: "sec_edgar:PLTR:1706140800"
      sec_notes: "10-K: Government revenue 55% of total. Top 20 customers represent 52% of revenue. Stock-based comp $500M."
    assert:
      - type: is-json
      - type: javascript
        value: |
          const r = JSON.parse(output);
          const text = JSON.stringify(r).toLowerCase();
          return text.includes('concentration') || text.includes('government') || text.includes('relian');

  # --- No Recency Bias ---

  - description: "Single day drop does not override long-term fundamentals"
    vars:
      ticker: CRM
      price_source_id: "yfinance:CRM:1706140800"
      price_data: '{"price": 245.00, "change_pct": -7.5, "volume": 25000000, "market_cap": 240000000000, "pe_ratio": 53.0, "52w_high": 318.71, "52w_low": 196.00}'
      fundamentals_source_id: "yfinance:CRM:1706140800"
      fundamentals: '{"revenue_growth": 11.0, "gross_margin": 75.0, "operating_margin": 30.0, "eps": 4.63, "free_cash_flow": 9500000000}'
      indicators_source_id: "yfinance:CRM:1706140800"
      indicators: '{"rsi_14": 32.0, "sma_50": 270.0, "sma_200": 255.0, "macd_histogram": -4.0}'
      news_source_id: "newsapi:CRM:1706140800"
      article_count: "2"
      news_text: "1. Salesforce drops 7% after AI agent revenue guidance disappoints. 2. Analysts maintain buy ratings, citing strong free cash flow and operating margins."
      sec_source_id: "sec_edgar:CRM:1706140800"
      sec_notes: "10-K: Operating cash flow $9.5B. Remaining performance obligations up 15% to $50B. 98% gross retention."
    assert:
      - type: is-json
      - type: javascript
        value: |
          const r = JSON.parse(output);
          // Should not be "sell" purely based on one day's drop when fundamentals are strong
          return r.signal !== 'sell' || r.confidence === 'low';
      - type: javascript
        value: "JSON.parse(output).bull_case.length >= 2"
