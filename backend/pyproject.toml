[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-investment-analyst"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    # Agent orchestration
    "langgraph>=0.3.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    # MCP server framework
    "fastmcp>=2.0.0",
    # Financial data
    "yfinance>=0.2.50",
    "feedparser>=6.0.11",
    # News
    "newsapi-python>=0.2.7",
    # Persistence
    "aiosqlite>=0.20.0",
    "langgraph-checkpoint-sqlite>=2.0.1",
    "motor>=3.4.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Utilities
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "cachetools>=5.3.3",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.1",
    # API server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Rate limiting
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
invest = "src.cli.main:app"
serve = "src.api.main:start"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
