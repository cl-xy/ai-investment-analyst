[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-investment-analyst"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    # Agent orchestration
    "langgraph>=0.3.0",
    "langchain>=1.3.14",
    "langchain-openai>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    # MCP server framework
    "fastmcp>=3.4.4",
    # Financial data
    "yfinance>=0.2.50",
    "feedparser>=6.0.11",
    # News
    "newsapi-python>=0.2.7",
    # Persistence
    "aiosqlite>=0.22.1",
    "langgraph-checkpoint-sqlite>=2.0.1",
    "asyncpg>=0.29.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Utilities
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "cachetools>=5.3.3",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.1",
    # API server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Rate limiting
    "slowapi>=0.1.10",
    # Logging
    "structlog>=26.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "hypothesis>=6.164.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
invest = "src.cli.main:app"
serve = "src.api.main:start"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "eval_gate: replay-driven CI evaluation gate tests (zero LLM calls)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E402", "E501"]

[tool.ruff.lint.isort]
# Explicit, so `src.*` is grouped as first-party regardless of the cwd ruff
# is invoked from (pre-commit always runs from the repo root; CI runs from
# backend/ via working-directory - without this, the two disagree on
# whether `src.*` is first- or third-party and fight over the same blank
# line on every run).
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

# numpy stubs ship Python 3.12+ syntax (type statements) that mypy rejects
# when checking under python_version = "3.11"
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

# langchain/langgraph have incomplete type stubs that produce false positives
# for .content access, ChatOpenAI kwargs, compiled graph methods, and
# AsyncSqliteSaver context manager protocol.
[[tool.mypy.overrides]]
module = [
    "src.agent.nodes.*",
    "src.api.routes.*",
    "src.cli.*",
    "src.api.main",
    "src.mcp_servers.*",
    "src.eval.*",
]
disable_error_code = ["attr-defined", "call-arg", "arg-type", "call-overload", "no-redef", "misc", "typeddict-unknown-key", "assignment", "dict-item", "return-value", "union-attr"]
