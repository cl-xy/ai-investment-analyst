name: Earnings Refresh Check

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: earnings-refresh-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend earnings refresh check
        env:
          EARNINGS_REFRESH_URL: ${{ secrets.EARNINGS_REFRESH_URL }}
          SCHEDULER_SECRET_TOKEN: ${{ secrets.SCHEDULER_SECRET_TOKEN }}
        run: |
          test -n "$EARNINGS_REFRESH_URL"
          test -n "$SCHEDULER_SECRET_TOKEN"
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 120 \
            -X POST "$EARNINGS_REFRESH_URL" \
            -H "x-scheduler-token: $SCHEDULER_SECRET_TOKEN" \
            -H "content-type: application/json"
