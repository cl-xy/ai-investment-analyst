name: Calibration Resolve

on:
  schedule:
    # Once daily; prediction horizons are measured in days, so more frequent
    # polling has no benefit. Also runs the Outcome-Grounded Evaluation
    # Flywheel's deterministic promotion policy over newly-resolved
    # predictions (see backend/src/eval_flywheel/promotion.py) — zero LLM
    # calls, safe to run alongside resolution in the same request.
    - cron: "10 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: calibration-resolve
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend prediction resolution + promotion
        env:
          CALIBRATION_RESOLVE_URL: ${{ secrets.CALIBRATION_RESOLVE_URL }}
          SCHEDULER_SECRET_TOKEN: ${{ secrets.SCHEDULER_SECRET_TOKEN }}
        run: |
          test -n "$CALIBRATION_RESOLVE_URL"
          test -n "$SCHEDULER_SECRET_TOKEN"
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 120 \
            -X POST "$CALIBRATION_RESOLVE_URL" \
            -H "x-scheduler-token: $SCHEDULER_SECRET_TOKEN" \
            -H "content-type: application/json"
