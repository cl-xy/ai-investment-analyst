name: Daily Digest (manual)

# NOTE: The scheduled daily digest is NOT triggered here anymore. It runs as
# the second step of `scheduled-portfolio-refresh.yml` (Scheduled Refresh and
# Digest), immediately after the monitored-universe refresh completes, so the
# digest always reflects freshly-refreshed ticker_analyses rows. Keeping a
# second scheduled trigger here would reintroduce the cross-workflow race
# (afternoon digest reading pre-refresh rows) this change removed.
#
# This workflow is retained for manual/on-demand sends only (workflow_dispatch).
# The backend's DB-backed once-per-ET-day idempotency guard (digest_sends)
# means a manual run on a day the chained workflow already sent will safely
# return status=skipped ("already sent today").

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger backend daily digest
        env:
          DAILY_DIGEST_URL: ${{ secrets.DAILY_DIGEST_URL }}
          SCHEDULER_SECRET_TOKEN: ${{ secrets.SCHEDULER_SECRET_TOKEN }}
        run: |
          test -n "$DAILY_DIGEST_URL"
          test -n "$SCHEDULER_SECRET_TOKEN"

          http_status=$(curl --show-error --silent \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 120 \
            --output response.json \
            --write-out "%{http_code}" \
            -X POST "$DAILY_DIGEST_URL" \
            -H "x-scheduler-token: $SCHEDULER_SECRET_TOKEN" \
            -H "content-type: application/json")

          echo "HTTP status: $http_status"
          echo "Response body:"
          cat response.json
          echo

          if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
            echo "::error::Digest endpoint returned HTTP $http_status"
            exit 1
          fi

          status=$(jq -r '.status // "missing"' response.json)
          message=$(jq -r '.message // "no message"' response.json)

          # A 200 with a bad/missing JSON body, or an explicit "failed"
          # status, must fail the step — HTTP-level success alone (the old
          # `curl --fail` check) doesn't mean the digest actually went out.
          case "$status" in
            success)
              echo "Digest sent successfully: $message"
              ;;
            skipped)
              # Two skip reasons are expected/benign: no monitored tickers
              # yet, or a digest already sent today (idempotency guard
              # catching a duplicate tick within the tolerant window above).
              # Any other skip reason (lock contention, unexpected state)
              # should fail loudly instead of being silently swallowed.
              if [[ "$message" == *"already sent today"* || "$message" == *"No monitored tickers"* || "$message" == *"Market closed today"* ]]; then
                echo "Digest skipped (benign): $message"
              else
                echo "::error::Digest skipped for an unexpected reason: $message"
                exit 1
              fi
              ;;
            failed)
              echo "::error::Digest send failed: $message"
              exit 1
              ;;
            *)
              echo "::error::Unexpected or missing status in response body: $status"
              exit 1
              ;;
          esac
