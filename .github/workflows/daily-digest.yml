name: Daily Digest

on:
  schedule:
    # Runs hourly on the half-hour; the schedule_check step below gates the
    # actual trigger to only fire at 4:30 PM ET (30 min after market close),
    # DST-aware via `TZ=America/New_York`. 16:30 ET = 20:30 UTC during EDT,
    # 21:30 UTC during EST — a fixed UTC cron can't express that shift, so
    # we check local time on every hourly tick instead (same pattern as
    # scheduled-portfolio-refresh.yml).
    - cron: "30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check ET schedule window
        id: schedule_check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_now=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_et=$(TZ=America/New_York date '+%H:%M')
          if [[ "$current_et" == "16:30" ]]; then
            echo "run_now=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_now=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger backend daily digest
        if: steps.schedule_check.outputs.run_now == 'true'
        env:
          DAILY_DIGEST_URL: ${{ secrets.DAILY_DIGEST_URL }}
          SCHEDULER_SECRET_TOKEN: ${{ secrets.SCHEDULER_SECRET_TOKEN }}
        run: |
          test -n "$DAILY_DIGEST_URL"
          test -n "$SCHEDULER_SECRET_TOKEN"
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 120 \
            -X POST "$DAILY_DIGEST_URL" \
            -H "x-scheduler-token: $SCHEDULER_SECRET_TOKEN" \
            -H "content-type: application/json"
